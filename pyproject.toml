[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emmad", email = "emmad.zahid@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.149.0",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
enterprise-rag = "enterprise_rag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
